name: Deploy Gemini Enterprise Admin Console to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT for Workload Identity Federation
  contents: read  # Required for actions/checkout

# ─────────────────────────────────────────────────────────────────────────────────
# Deployment configuration. Nothing here is environment-specific: set these as
# GitHub Actions *repository variables* (Settings → Secrets and variables → Actions
# → Variables). Secrets WIF_PROVIDER and WIF_SERVICE_ACCOUNT are required.
#
#   GCP_PROJECT_ID     (required) target GCP project
#   GCP_REGION         (optional) default us-central1
#   CLOUD_RUN_SERVICE  (optional) default gemini-license-provisioner
#   ARTIFACT_REPO      (optional) default gemini-provisioner-docker
#   CLOUD_SCHEDULER_JOB(optional) default gemini-license-sync-job (the cron trigger)
#   CLOUD_RUN_JOB      (optional) default gemini-license-sync-runner (job the schedule runs)
#   FIREBASE_API_KEY      (required for sign-in to work) Firebase Web API key, not secret
#   FIREBASE_PROJECT_ID   (required for sign-in to work) usually same as GCP_PROJECT_ID
#   PUBLIC_BASE_URL       (optional) https base URL for links in notification emails
#   SCHEDULED_SYNC_TENANT_ID      (optional) the one tenant the scheduled job syncs -
#                                 see app/job_runner.py's module docstring; a known,
#                                 tracked limitation of Phase 1 of the multi-tenant
#                                 conversion, replaced by a proper fan-out in Phase 5
#   SCHEDULED_SYNC_ENVIRONMENT_ID (optional) the environment within that tenant
# ─────────────────────────────────────────────────────────────────────────────────
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'gemini-license-provisioner' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPO || 'gemini-provisioner-docker' }}
  SCHEDULER_JOB: ${{ vars.CLOUD_SCHEDULER_JOB || 'gemini-license-sync-job' }}
  SYNC_JOB: ${{ vars.CLOUD_RUN_JOB || 'gemini-license-sync-runner' }}
  IMAGE_NAME: provisioner

jobs:
  deploy:
    name: Build & Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          if [ -z "${{ env.PROJECT_ID }}" ]; then
            echo "::error::Repository variable GCP_PROJECT_ID is not set. See setup_instructions.md Step 5."
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "Building container: ${IMAGE_URI}:${IMAGE_TAG}..."

          docker build \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            .

          echo "Pushing image to Artifact Registry..."
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          ENV_VARS="GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},CLOUD_SCHEDULER_JOB_NAME=${{ env.SCHEDULER_JOB }},RUNTIME_SERVICE_ACCOUNT_EMAIL=${{ secrets.WIF_SERVICE_ACCOUNT }}"
          [ -n "${FIREBASE_API_KEY}" ]    && ENV_VARS="${ENV_VARS},FIREBASE_API_KEY=${FIREBASE_API_KEY}"
          [ -n "${FIREBASE_PROJECT_ID}" ] && ENV_VARS="${ENV_VARS},FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
          [ -n "${PUBLIC_BASE_URL}" ]     && ENV_VARS="${ENV_VARS},PUBLIC_BASE_URL=${PUBLIC_BASE_URL}"

          echo "Deploying ${IMAGE_URI} to Cloud Run service '${{ env.SERVICE_NAME }}'..."
          # Public by design: every request is authorized in-app via a Firebase
          # session cookie + Firestore tenant membership, not a network-level
          # gate - see the note on google_cloud_run_v2_service in terraform/main.tf.
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_URI}" \
            --region ${{ env.REGION }} \
            --service-account "${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --timeout 600 \
            --memory 1024Mi \
            --cpu 1 \
            --set-env-vars "${ENV_VARS}" \
            --allow-unauthenticated \
            --quiet

      - name: Deploy the scheduled-sync Cloud Run Job
        env:
          IMAGE_TAG: ${{ github.sha }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SCHEDULED_SYNC_TENANT_ID: ${{ vars.SCHEDULED_SYNC_TENANT_ID }}
          SCHEDULED_SYNC_ENVIRONMENT_ID: ${{ vars.SCHEDULED_SYNC_ENVIRONMENT_ID }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          # The job runs the sync worker directly (no HTTP). Phase 1 limitation:
          # it syncs exactly one designated tenant/environment - see
          # app/job_runner.py's module docstring.
          JOB_ENV_VARS="GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},RUNTIME_SERVICE_ACCOUNT_EMAIL=${{ secrets.WIF_SERVICE_ACCOUNT }}"
          [ -n "${PUBLIC_BASE_URL}" ]                   && JOB_ENV_VARS="${JOB_ENV_VARS},PUBLIC_BASE_URL=${PUBLIC_BASE_URL}"
          [ -n "${SCHEDULED_SYNC_TENANT_ID}" ]          && JOB_ENV_VARS="${JOB_ENV_VARS},SCHEDULED_SYNC_TENANT_ID=${SCHEDULED_SYNC_TENANT_ID}"
          [ -n "${SCHEDULED_SYNC_ENVIRONMENT_ID}" ]     && JOB_ENV_VARS="${JOB_ENV_VARS},SCHEDULED_SYNC_ENVIRONMENT_ID=${SCHEDULED_SYNC_ENVIRONMENT_ID}"

          echo "Deploying ${IMAGE_URI} to Cloud Run job '${{ env.SYNC_JOB }}'..."
          # Use `--flag=value` form: the args value starts with "-m", which gcloud
          # would otherwise parse as another flag ("--args: expected one argument").
          gcloud run jobs deploy ${{ env.SYNC_JOB }} \
            --image "${IMAGE_URI}" \
            --region ${{ env.REGION }} \
            --service-account "${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --command=python \
            --args=-m,app.job_runner \
            --max-retries 0 \
            --task-timeout 1800 \
            --set-env-vars "${JOB_ENV_VARS}" \
            --quiet

      - name: Output Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "=========================================================="
          echo "Gemini Enterprise Admin Console Deployed Successfully!"
          echo "Admin Console URL: ${SERVICE_URL}"
          echo "Scheduled sync:    Cloud Run job '${{ env.SYNC_JOB }}' (Cloud Scheduler '${{ env.SCHEDULER_JOB }}')"
          echo "=========================================================="
