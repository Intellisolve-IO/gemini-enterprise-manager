name: Deploy Gemini License Provisioner to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for requesting the JWT for Workload Identity Federation
  contents: read  # Required for actions/checkout

# ─────────────────────────────────────────────────────────────────────────────────
# Deployment configuration. Nothing here is environment-specific: set these as
# GitHub Actions *repository variables* (Settings → Secrets and variables → Actions
# → Variables). Secrets WIF_PROVIDER and WIF_SERVICE_ACCOUNT are required.
#
#   GCP_PROJECT_ID     (required) target GCP project
#   GCP_REGION         (optional) default us-central1
#   CLOUD_RUN_SERVICE  (optional) default gemini-license-provisioner
#   ARTIFACT_REPO      (optional) default gemini-provisioner-docker
#   CLOUD_SCHEDULER_JOB(optional) default gemini-license-sync-job (the cron trigger)
#   CLOUD_RUN_JOB      (optional) default gemini-license-sync-runner (job the schedule runs)
#   DELEGATED_ADMIN_EMAIL (optional) delegated admin to impersonate; if unset,
#                         configure it on the app's Settings page after deploy
#   IAP_AUDIENCE          (optional) enables the in-app Workspace super-admin check
#                         (set once IAP is turned on; see setup_instructions.md)
#   SYNC_INVOKER_SA_EMAIL (optional) scheduler SA allowed through /api/sync/run when IAP is on
#   AUTH_BOOTSTRAP_ADMINS (optional) comma-separated break-glass admin emails
#   SUPER_ADMIN_CACHE_TTL (optional) seconds to cache the super-admin lookup (default 300)
#   NOTIFICATION_SENDER_EMAIL (optional) mailbox for run-notification emails
#   PUBLIC_BASE_URL       (optional) https base URL for links in notification emails
#   CLOUD_RUN_ALLOW_UNAUTH(optional) default 'true'; set 'false' after enabling IAP
#   CLOUD_RUN_ENABLE_IAP  (optional) 'true' enables IAP, 'false' disables, unset = leave as-is
# ─────────────────────────────────────────────────────────────────────────────────
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'gemini-license-provisioner' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPO || 'gemini-provisioner-docker' }}
  SCHEDULER_JOB: ${{ vars.CLOUD_SCHEDULER_JOB || 'gemini-license-sync-job' }}
  SYNC_JOB: ${{ vars.CLOUD_RUN_JOB || 'gemini-license-sync-runner' }}
  IMAGE_NAME: provisioner

jobs:
  deploy:
    name: Build & Deploy to GCP Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          if [ -z "${{ env.PROJECT_ID }}" ]; then
            echo "::error::Repository variable GCP_PROJECT_ID is not set. See setup_instructions.md Step 5."
            exit 1
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "Building container: ${IMAGE_URI}:${IMAGE_TAG}..."

          docker build \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            .

          echo "Pushing image to Artifact Registry..."
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE_TAG: ${{ github.sha }}
          DELEGATED_ADMIN_EMAIL: ${{ vars.DELEGATED_ADMIN_EMAIL }}
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
          SYNC_INVOKER_SA_EMAIL: ${{ vars.SYNC_INVOKER_SA_EMAIL }}
          AUTH_BOOTSTRAP_ADMINS: ${{ vars.AUTH_BOOTSTRAP_ADMINS }}
          SUPER_ADMIN_CACHE_TTL: ${{ vars.SUPER_ADMIN_CACHE_TTL }}
          NOTIFICATION_SENDER_EMAIL: ${{ vars.NOTIFICATION_SENDER_EMAIL }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          # Set repo variable CLOUD_RUN_ALLOW_UNAUTH=false once IAP is enabled,
          # so CI stops re-opening the service on every deploy.
          ALLOW_UNAUTH: ${{ vars.CLOUD_RUN_ALLOW_UNAUTH || 'true' }}
          # CLOUD_RUN_ENABLE_IAP: 'true' turns IAP on, 'false' turns it off,
          # unset leaves the current IAP state untouched.
          ENABLE_IAP: ${{ vars.CLOUD_RUN_ENABLE_IAP }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          ENV_VARS="GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},CLOUD_SCHEDULER_JOB_NAME=${{ env.SCHEDULER_JOB }},RUNTIME_SERVICE_ACCOUNT_EMAIL=${{ secrets.WIF_SERVICE_ACCOUNT }}"
          [ -n "${DELEGATED_ADMIN_EMAIL}" ]     && ENV_VARS="${ENV_VARS},DELEGATED_ADMIN_EMAIL=${DELEGATED_ADMIN_EMAIL}"
          [ -n "${IAP_AUDIENCE}" ]              && ENV_VARS="${ENV_VARS},IAP_AUDIENCE=${IAP_AUDIENCE}"
          [ -n "${SYNC_INVOKER_SA_EMAIL}" ]     && ENV_VARS="${ENV_VARS},SYNC_INVOKER_SA_EMAIL=${SYNC_INVOKER_SA_EMAIL}"
          [ -n "${AUTH_BOOTSTRAP_ADMINS}" ]     && ENV_VARS="${ENV_VARS},AUTH_BOOTSTRAP_ADMINS=${AUTH_BOOTSTRAP_ADMINS}"
          [ -n "${SUPER_ADMIN_CACHE_TTL}" ]     && ENV_VARS="${ENV_VARS},SUPER_ADMIN_CACHE_TTL=${SUPER_ADMIN_CACHE_TTL}"
          [ -n "${NOTIFICATION_SENDER_EMAIL}" ] && ENV_VARS="${ENV_VARS},NOTIFICATION_SENDER_EMAIL=${NOTIFICATION_SENDER_EMAIL}"
          [ -n "${PUBLIC_BASE_URL}" ]           && ENV_VARS="${ENV_VARS},PUBLIC_BASE_URL=${PUBLIC_BASE_URL}"

          if [ "${ALLOW_UNAUTH}" = "false" ]; then AUTH_FLAG="--no-allow-unauthenticated"; else AUTH_FLAG="--allow-unauthenticated"; fi

          IAP_FLAG=""
          if [ "${ENABLE_IAP}" = "true" ]; then IAP_FLAG="--iap"; elif [ "${ENABLE_IAP}" = "false" ]; then IAP_FLAG="--no-iap"; fi

          echo "Deploying ${IMAGE_URI} to Cloud Run service '${{ env.SERVICE_NAME }}' (${AUTH_FLAG} ${IAP_FLAG})..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE_URI}" \
            --region ${{ env.REGION }} \
            --service-account "${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --timeout 600 \
            --memory 1024Mi \
            --cpu 1 \
            --set-env-vars "${ENV_VARS}" \
            ${AUTH_FLAG} ${IAP_FLAG} \
            --quiet

      - name: Deploy the scheduled-sync Cloud Run Job
        env:
          IMAGE_TAG: ${{ github.sha }}
          DELEGATED_ADMIN_EMAIL: ${{ vars.DELEGATED_ADMIN_EMAIL }}
          NOTIFICATION_SENDER_EMAIL: ${{ vars.NOTIFICATION_SENDER_EMAIL }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          LICENSE_CONFIG: ${{ vars.LICENSE_CONFIG }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          # The job runs the sync worker directly (no HTTP, no IAP). It only needs
          # the worker's env - not the IAP / auth settings the web service uses.
          JOB_ENV_VARS="GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},RUNTIME_SERVICE_ACCOUNT_EMAIL=${{ secrets.WIF_SERVICE_ACCOUNT }}"
          [ -n "${DELEGATED_ADMIN_EMAIL}" ]     && JOB_ENV_VARS="${JOB_ENV_VARS},DELEGATED_ADMIN_EMAIL=${DELEGATED_ADMIN_EMAIL}"
          [ -n "${NOTIFICATION_SENDER_EMAIL}" ] && JOB_ENV_VARS="${JOB_ENV_VARS},NOTIFICATION_SENDER_EMAIL=${NOTIFICATION_SENDER_EMAIL}"
          [ -n "${PUBLIC_BASE_URL}" ]           && JOB_ENV_VARS="${JOB_ENV_VARS},PUBLIC_BASE_URL=${PUBLIC_BASE_URL}"
          [ -n "${LICENSE_CONFIG}" ]            && JOB_ENV_VARS="${JOB_ENV_VARS},LICENSE_CONFIG=${LICENSE_CONFIG}"

          echo "Deploying ${IMAGE_URI} to Cloud Run job '${{ env.SYNC_JOB }}'..."
          # Use `--flag=value` form: the args value starts with "-m", which gcloud
          # would otherwise parse as another flag ("--args: expected one argument").
          gcloud run jobs deploy ${{ env.SYNC_JOB }} \
            --image "${IMAGE_URI}" \
            --region ${{ env.REGION }} \
            --service-account "${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --command=python \
            --args=-m,app.job_runner \
            --max-retries 0 \
            --task-timeout 1800 \
            --set-env-vars "${JOB_ENV_VARS}" \
            --quiet

      - name: Output Service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "=========================================================="
          echo "Gemini License Provisioner Deployed Successfully!"
          echo "Admin Dashboard URL: ${SERVICE_URL}"
          echo "Manual sync endpoint: ${SERVICE_URL}/api/sync/run  (dashboard button)"
          echo "Scheduled sync:       Cloud Run job '${{ env.SYNC_JOB }}' (Cloud Scheduler '${{ env.SCHEDULER_JOB }}')"
          echo "=========================================================="
